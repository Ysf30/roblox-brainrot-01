<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brainrot Base Defense - Screenshot Viewer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #1a1a2e; font-family: 'Fredoka One', cursive; }
        canvas { display: block; }
        #ui {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 100;
            color: #fff;
            pointer-events: none;
        }
        #shot-label {
            font-size: 24px;
            text-shadow: 2px 2px 4px #000;
            background: rgba(0,0,0,0.7);
            padding: 10px 20px;
            border-radius: 10px;
            border: 2px solid #ff00ff;
        }
        #info {
            position: fixed;
            bottom: 20px;
            left: 20px;
            color: #aaa;
            font-size: 14px;
            pointer-events: none;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
</head>
<body>
    <div id="ui">
        <div id="shot-label">Loading...</div>
    </div>
    <div id="info">Brainrot Base Defense | Use ?shot=0..3 for different views</div>
    <script type="importmap">
    {
        "imports": {
            "three": "./three.module.js",
            "three/addons/": "./"
        }
    }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from './OrbitControls.js';

        // Load layout data
        let layout = null;
        async function loadLayout() {
            const response = await fetch('./renderer-layout.json');
            layout = await response.json();
        }

        // Renderer setup
        const canvas = document.createElement('canvas');
        document.body.appendChild(canvas);
        const renderer = new THREE.WebGLRenderer({
            canvas,
            antialias: true,
            alpha: true
        });
        renderer.setSize(1280, 706);
        renderer.setPixelRatio(1);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;

        // Scene
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);
        scene.fog = new THREE.Fog(0x1a1a2e, 50, 200);

        // Camera
        const camera = new THREE.PerspectiveCamera(60, 1280 / 706, 0.1, 500);

        // Controls (for manual inspection)
        const controls = new OrbitControls(camera, canvas);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.enablePan = true;
        controls.minDistance = 10;
        controls.maxDistance = 200;

        // Lights
        const ambientLight = new THREE.AmbientLight(0x4d4d59, 0.8);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xfff1e6, 2);
        sunLight.position.set(-50, 100, -30);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        sunLight.shadow.camera.near = 1;
        sunLight.shadow.camera.far = 200;
        sunLight.shadow.camera.left = -100;
        sunLight.shadow.camera.right = 100;
        sunLight.shadow.camera.top = 100;
        sunLight.shadow.camera.bottom = -100;
        sunLight.shadow.bias = -0.001;
        scene.add(sunLight);

        // Hemisphere light for nice outdoor feel
        const hemiLight = new THREE.HemisphereLight(0x87ceeb, 0x4a4a3a, 0.5);
        scene.add(hemiLight);

        // Materials
        const materials = {
            concrete: new THREE.MeshStandardMaterial({
                color: 0x3c3c46,
                roughness: 0.9,
                metalness: 0.1
            }),
            metal: new THREE.MeshStandardMaterial({
                color: 0x50505a,
                roughness: 0.3,
                metalness: 0.9
            }),
            neon: new THREE.MeshBasicMaterial({
                transparent: true,
                opacity: 0.8
            }),
            forcefield: new THREE.MeshBasicMaterial({
                transparent: true,
                opacity: 0.3,
                side: THREE.DoubleSide
            }),
            glass: new THREE.MeshPhysicalMaterial({
                color: 0x6496ff,
                transparency: 0.5,
                opacity: 0.5,
                transmission: 0.8,
                thickness: 0.5,
                roughness: 0,
                metalness: 0,
                side: THREE.DoubleSide
            }),
            wood: new THREE.MeshStandardMaterial({
                color: 0x785a3c,
                roughness: 0.8,
                metalness: 0
            }),
            slate: new THREE.MeshStandardMaterial({
                color: 0x502814,
                roughness: 0.7,
                metalness: 0.1
            }),
            rock: new THREE.MeshStandardMaterial({
                color: 0x646464,
                roughness: 0.9,
                metalness: 0
            }),
            diamondPlate: new THREE.MeshStandardMaterial({
                color: 0xc8c8c8,
                roughness: 0.4,
                metalness: 0.6
            }),
            grass: new THREE.MeshStandardMaterial({
                color: 0x2d5a2d,
                roughness: 1,
                metalness: 0
            }),
        };

        // Rarity colors
        const rarityColors = {
            Common: 0xb4b4b4,
            Uncommon: 0x50c850,
            Rare: 0x5078ff,
            Epic: 0xb450ff,
            Legendary: 0xffb400,
            Mythic: 0xff3c78,
            BrainrotGod: 0xff00ff,
        };

        // Mutation colors
        const mutationColors = {
            None: 0xffffff,
            Shiny: 0xffff96,
            Golden: 0xffd700,
            Rainbow: 0xff00ff,
            Corrupted: 0x640096,
            Glitched: 0x00ffff,
            Void: 0x140028,
        };

        // Create a box geometry
        function createBox(size, color, materialOverride = null, position = [0,0,0], rotation = [0,0,0]) {
            const geometry = new THREE.BoxGeometry(size[0], size[1], size[2]);
            let material;
            if (materialOverride) {
                material = materialOverride.clone();
                material.color.setHex(color);
            } else {
                material = new THREE.MeshStandardMaterial({ color, roughness: 0.5, metalness: 0.2 });
            }
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(position[0], position[1], position[2]);
            mesh.rotation.set(rotation[0], rotation[1], rotation[2]);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            return mesh;
        }

        // Create cylinder (for toilet, etc)
        function createCylinder(size, color, materialOverride = null, position = [0,0,0]) {
            const geometry = new THREE.CylinderGeometry(size[0]/2, size[0]/2, size[1], 16);
            let material;
            if (materialOverride) {
                material = materialOverride.clone();
                material.color.setHex(color);
            } else {
                material = new THREE.MeshStandardMaterial({ color, roughness: 0.5, metalness: 0.2 });
            }
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(position[0], position[1], position[2]);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            return mesh;
        }

        // Create sphere (for skull, etc)
        function createSphere(size, color, materialOverride = null, position = [0,0,0]) {
            const geometry = new THREE.SphereGeometry(size[0]/2, 16, 16);
            let material;
            if (materialOverride) {
                material = materialOverride.clone();
                material.color.setHex(color);
            } else {
                material = new THREE.MeshStandardMaterial({ color, roughness: 0.5, metalness: 0.2 });
            }
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(position[0], position[1], position[2]);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            return mesh;
        }

        // Add glow effect to brainrot
        function addGlow(mesh, color, intensity) {
            const glowGeometry = new THREE.SphereGeometry(1, 16, 16);
            const glowMaterial = new THREE.MeshBasicMaterial({
                color: color,
                transparent: true,
                opacity: 0.15 * intensity,
                side: THREE.BackSide,
            });
            const glow = new THREE.Mesh(glowGeometry, glowMaterial);
            glow.scale.setScalar(1.5 + intensity * 0.5);
            mesh.add(glow);

            // Animate glow
            const originalScale = glow.scale.clone();
            const animateGlow = () => {
                const time = Date.now() * 0.002;
                glow.scale.setScalar(originalScale.x + Math.sin(time) * 0.1 * intensity);
                requestAnimationFrame(animateGlow);
            };
            animateGlow();

            return glow;
        }

        // Build the world
        function buildWorld() {
            // Base plot
            const basePlot = layout.basePlot;
            const baseGeometry = new THREE.BoxGeometry(basePlot.size[0], basePlot.size[1], basePlot.size[2]);
            const baseMaterial = new THREE.MeshStandardMaterial({
                color: new THREE.Color().fromArray(basePlot.color),
                roughness: 0.9,
                metalness: 0.1
            });
            const baseMesh = new THREE.Mesh(baseGeometry, baseMaterial);
            baseMesh.position.fromArray(basePlot.position);
            baseMesh.receiveShadow = true;
            scene.add(baseMesh);

            // Grid lines
            for (const line of basePlot.gridLines) {
                const lineGeom = new THREE.BoxGeometry(line.size[0], line.size[1], line.size[2]);
                const lineMat = materials.neon.clone();
                lineMat.color.fromArray(line.color);
                lineMat.opacity = 1 - line.transparency;
                const lineMesh = new THREE.Mesh(lineGeom, lineMat);
                lineMesh.position.fromArray(line.position);
                scene.add(lineMesh);
            }

            // Base core
            const core = layout.baseCore;
            const coreGeom = new THREE.BoxGeometry(core.size[0], core.size[1], core.size[2]);
            const coreMat = materials.forcefield.clone();
            coreMat.color.fromArray(core.color);
            coreMat.opacity = 1 - core.transparency;
            const coreMesh = new THREE.Mesh(coreGeom, coreMat);
            coreMesh.position.fromArray(core.position);
            scene.add(coreMesh);

            // Core glow
            const coreLight = new THREE.PointLight(core.color, 2, 30);
            coreLight.position.fromArray(core.position);
            scene.add(coreLight);

            // Core particles (represented as small spheres)
            for (let i = 0; i < 20; i++) {
                const particle = new THREE.Mesh(
                    new THREE.SphereGeometry(0.2, 8, 8),
                    new THREE.MeshBasicMaterial({ color: core.color, transparent: true, opacity: 0.6 })
                );
                particle.position.set(
                    core.position[0] + (Math.random() - 0.5) * 6,
                    core.position[1] + (Math.random() - 0.5) * 8,
                    core.position[2] + (Math.random() - 0.5) * 6
                );
                scene.add(particle);

                // Animate
                const startY = particle.position.y;
                const startTime = Math.random() * Math.PI * 2;
                const animateParticle = () => {
                    const time = Date.now() * 0.001 + startTime;
                    particle.position.y = startY + Math.sin(time) * 1.5;
                    particle.material.opacity = 0.3 + Math.sin(time * 2) * 0.3;
                    requestAnimationFrame(animateParticle);
                };
                animateParticle();
            }

            // Spawn lane / conveyor
            const lane = layout.spawnLane;

            // Conveyor base
            const convBase = lane.conveyorBase;
            const convGeom = new THREE.BoxGeometry(convBase.size[0], convBase.size[1], convBase.size[2]);
            const convMat = materials.metal.clone();
            convMat.color.fromArray(convBase.color);
            const convMesh = new THREE.Mesh(convGeom, convMat);
            convMesh.position.fromArray(convBase.position);
            convMesh.receiveShadow = true;
            scene.add(convMesh);

            // Conveyor sections
            for (const section of lane.conveyorSections) {
                const secGeom = new THREE.BoxGeometry(section.size[0], section.size[1], section.size[2]);
                const secMat = materials.metal.clone();
                secMat.color.fromArray(section.color);
                const secMesh = new THREE.Mesh(secGeom, secMat);
                secMesh.position.fromArray(section.position);
                secMesh.castShadow = true;
                secMesh.receiveShadow = true;
                scene.add(secMesh);
            }

            // Side walls
            for (const wall of lane.sideWalls) {
                const wallGeom = new THREE.BoxGeometry(wall.size[0], wall.size[1], wall.size[2]);
                const wallMat = materials.glass.clone();
                wallMat.color.fromArray(wall.color);
                wallMat.opacity = 1 - wall.transparency;
                const wallMesh = new THREE.Mesh(wallGeom, wallMat);
                wallMesh.position.fromArray(wall.position);
                scene.add(wallMesh);
            }

            // Spawn pad
            const pad = lane.spawnPad;
            const padGeom = new THREE.BoxGeometry(pad.size[0], pad.size[1], pad.size[2]);
            const padMat = materials.neon.clone();
            padMat.color.fromArray(pad.color);
            const padMesh = new THREE.Mesh(padGeom, padMat);
            padMesh.position.fromArray(pad.position);
            padMesh.castShadow = true;
            scene.add(padMesh);

            // Spawn pad glow
            const padLight = new THREE.PointLight(pad.color, 1, 15);
            padLight.position.fromArray(pad.position);
            padLight.position.y += 3;
            scene.add(padLight);

            // Shop building
            const shop = layout.shop;

            // Floor
            const floorGeom = new THREE.BoxGeometry(shop.floor.size[0], shop.floor.size[1], shop.floor.size[2]);
            const floorMat = materials.wood.clone();
            floorMat.color.fromArray(shop.floor.color);
            const floorMesh = new THREE.Mesh(floorGeom, floorMat);
            floorMesh.position.fromArray(shop.floor.position);
            floorMesh.receiveShadow = true;
            scene.add(floorMesh);

            // Walls
            for (const wall of shop.walls) {
                const wallGeom = new THREE.BoxGeometry(wall.size[0], wall.size[1], wall.size[2]);
                const wallMat = materials.wood.clone();
                wallMat.color.fromArray(wall.color);
                const wallMesh = new THREE.Mesh(wallGeom, wallMat);
                wallMesh.position.set(
                    shop.position[0] + wall.position[0],
                    shop.position[1] + wall.position[1],
                    shop.position[2] + wall.position[2]
                );
                wallMesh.castShadow = true;
                wallMesh.receiveShadow = true;
                scene.add(wallMesh);
            }

            // Roof
            const roofGeom = new THREE.BoxGeometry(shop.roof.size[0], shop.roof.size[1], shop.roof.size[2]);
            const roofMat = materials.slate.clone();
            roofMat.color.fromArray(shop.roof.color);
            const roofMesh = new THREE.Mesh(roofGeom, roofMat);
            roofMesh.position.fromArray(shop.roof.position);
            roofMesh.castShadow = true;
            scene.add(roofMesh);

            // Sign
            const signGeom = new THREE.BoxGeometry(shop.sign.size[0], shop.sign.size[1], shop.sign.size[2]);
            const signMat = materials.neon.clone();
            signMat.color.fromArray(shop.sign.color);
            const signMesh = new THREE.Mesh(signGeom, signMat);
            signMesh.position.fromArray(shop.sign.position);
            signMesh.castShadow = true;
            scene.add(signMesh);

            // Sign glow
            const signLight = new THREE.PointLight(shop.sign.color, 2, 30);
            signLight.position.fromArray(shop.sign.position);
            scene.add(signLight);

            // Reroll pad
            const rerollPad = shop.rerollPad;
            const rerollGeom = new THREE.BoxGeometry(rerollPad.size[0], rerollPad.size[1], rerollPad.size[2]);
            const rerollMat = materials.neon.clone();
            rerollMat.color.fromArray(rerollPad.color);
            const rerollMesh = new THREE.Mesh(rerollGeom, rerollMat);
            rerollMesh.position.fromArray(rerollPad.position);
            scene.add(rerollMesh);

            // Hazard zones
            for (const zone of layout.hazardZones) {
                const zoneGeom = new THREE.BoxGeometry(zone.size[0], zone.size[1], zone.size[2]);
                let zoneMat;
                if (zone.name === 'LightZone') {
                    zoneMat = materials.forcefield.clone();
                } else if (zone.name === 'StablePlatform') {
                    zoneMat = materials.diamondPlate.clone();
                } else if (zone.name === 'BaseRoof') {
                    zoneMat = materials.metal.clone();
                } else {
                    zoneMat = materials.rock.clone();
                }
                zoneMat.color.fromArray(zone.color);
                zoneMat.transparent = zone.transparency !== undefined;
                zoneMat.opacity = zone.transparency !== undefined ? 1 - zone.transparency : 1;
                zoneMat.side = zone.transparency !== undefined ? THREE.DoubleSide : THREE.FrontSide;

                const zoneMesh = new THREE.Mesh(zoneGeom, zoneMat);
                zoneMesh.position.fromArray(zone.position);
                if (zone.name !== 'BaseRoof' && zone.name !== 'StablePlatform') {
                    zoneMesh.castShadow = true;
                }
                zoneMesh.receiveShadow = true;
                scene.add(zoneMesh);

                // Zone label (as a sprite)
                const spriteMat = new THREE.SpriteMaterial({
                    color: 0xffffff,
                    transparent: true,
                    opacity: 0.8,
                });
                const sprite = new THREE.Sprite(spriteMat);
                sprite.position.fromArray(zone.position);
                sprite.position.y += zone.size[1] / 2 + 3;
                sprite.scale.set(10, 5, 1);
                scene.add(sprite);
            }

            // Brainrots - sample on base (for play/progression shots)
            const shotParam = new URLSearchParams(window.location.search).get('shot');
            const shot = shotParam ? parseInt(shotParam) : 0;

            let brainrotsToShow = [];
            if (shot === 0) {
                // Start screen - show conveyor brainrots
                brainrotsToShow = layout.conveyorBrainrots;
            } else {
                // Play, progression, summit - show base brainrots
                brainrotsToShow = layout.sampleBrainrots;
            }

            for (const br of brainrotsToShow) {
                let mesh;
                let mat;

                // Determine material based on mutation
                const mutationColor = mutationColors[br.mutation] || rarityColors[br.rarity];
                const isMutated = br.mutation !== 'None';

                if (isMutated) {
                    mat = materials.neon.clone();
                    mat.color.setHex(mutationColor);
                    mat.opacity = 0.9;
                } else {
                    mat = new THREE.MeshStandardMaterial({
                        color: mutationColor,
                        roughness: 0.4,
                        metalness: 0.3
                    });
                }

                // Special shapes for certain brainrots
                if (br.id === 'skibidi_toilet') {
                    mesh = createCylinder(br.size, mutationColor, mat, br.position);
                } else if (br.id.includes('skull') || br.id === 'brainrot_cat' || br.id === 'the_one_brainrot') {
                    mesh = createSphere(br.size, mutationColor, mat, br.position);
                } else if (br.id.includes('dragon') || br.id.includes('titan') || br.id.includes('archon')) {
                    // Large creatures - box with extra parts
                    mesh = createBox(br.size, mutationColor, mat, br.position);

                    // Add wings for dragon/titan
                    if (br.id.includes('dragon') || br.id.includes('titan')) {
                        const wingGeom = new THREE.BoxGeometry(4, 0.5, 6);
                        const wingMat = mat.clone();
                        const wing1 = new THREE.Mesh(wingGeom, wingMat);
                        wing1.position.set(br.position[0] - 4, br.position[1], br.position[2]);
                        wing1.castShadow = true;
                        scene.add(wing1);

                        const wing2 = new THREE.Mesh(wingGeom, wingMat);
                        wing2.position.set(br.position[0] + 4, br.position[1], br.position[2]);
                        wing2.castShadow = true;
                        scene.add(wing2);
                    }

                    // Ring for THE ONE BRAINROT
                    if (br.id === 'the_one_brainrot') {
                        const ringGeom = new THREE.TorusGeometry(8, 0.3, 16, 64);
                        const ringMat = materials.neon.clone();
                        ringMat.color.setHex(0x00ffff);
                        ringMat.opacity = 0.7;
                        const ring = new THREE.Mesh(ringGeom, ringMat);
                        ring.position.fromArray(br.position);
                        ring.rotation.x = Math.PI / 2;
                        scene.add(ring);

                        // Animate ring
                        const animateRing = () => {
                            ring.rotation.y += 0.01;
                            ring.rotation.z += 0.005;
                            requestAnimationFrame(animateRing);
                        };
                        animateRing();
                    }
                } else {
                    mesh = createBox(br.size, mutationColor, mat, br.position);
                }

                mesh.castShadow = true;
                mesh.receiveShadow = true;
                scene.add(mesh);

                // Add rarity glow
                const rarityData = {
                    Common: 0, Uncommon: 0.3, Rare: 0.5,
                    Epic: 0.7, Legendary: 1.0, Mythic: 1.5, BrainrotGod: 2.5
                };
                const glowIntensity = rarityData[br.rarity] || 0;
                if (glowIntensity > 0) {
                    addGlow(mesh, mutationColor, glowIntensity);
                }

                // Add name label as sprite
                const canvas = document.createElement('canvas');
                canvas.width = 512;
                canvas.height = 128;
                const ctx = canvas.getContext('2d');
                ctx.font = 'bold 48px "Fredoka One", cursive';
                ctx.fillStyle = '#ffffff';
                ctx.strokeStyle = '#000000';
                ctx.lineWidth = 4;
                ctx.textAlign = 'center';
                const text = br.name + (isMutated ? ` [${br.mutation}]` : '');
                ctx.strokeText(text, 256, 80);
                ctx.fillText(text, 256, 80);

                const mps = Math.floor(getMoneyPerSec(br.id, br.mutation));
                ctx.font = '32px "Fredoka One", cursive';
                ctx.fillStyle = '#00ff96';
                ctx.strokeStyle = '#000000';
                ctx.lineWidth = 3;
                ctx.strokeText(`+${formatNumber(mps)}/s`, 256, 120);
                ctx.fillText(`+${formatNumber(mps)}/s`, 256, 120);

                const texture = new THREE.CanvasTexture(canvas);
                const spriteMat = new THREE.SpriteMaterial({ map: texture, transparent: true });
                const sprite = new THREE.Sprite(spriteMat);
                sprite.position.set(br.position[0], br.position[1] + br.size[1]/2 + 3, br.position[2]);
                sprite.scale.set(12, 3, 1);
                scene.add(sprite);
            }

            // Player avatar (simple blocky character)
            if (shot !== 3) { // Not in summit view
                const player = layout.playerStart;
                const avatar = new THREE.Group();

                // Body
                const bodyGeom = new THREE.BoxGeometry(2, 3, 1.5);
                const bodyMat = new THREE.MeshStandardMaterial({ color: 0xffdbac, roughness: 0.8, metalness: 0 });
                const body = new THREE.Mesh(bodyGeom, bodyMat);
                body.position.y = 1.5;
                body.castShadow = true;
                avatar.add(body);

                // Head
                const headGeom = new THREE.BoxGeometry(2, 2, 2);
                const headMat = new THREE.MeshStandardMaterial({ color: 0xffdbac, roughness: 0.8, metalness: 0 });
                const head = new THREE.Mesh(headGeom, headMat);
                head.position.y = 4;
                head.castShadow = true;
                avatar.add(head);

                // Arms
                for (const side of [-1, 1]) {
                    const armGeom = new THREE.BoxGeometry(1, 2.5, 1);
                    const arm = new THREE.Mesh(armGeom, bodyMat);
                    arm.position.set(side * 1.7, 1.5, 0);
                    arm.castShadow = true;
                    avatar.add(arm);
                }

                // Legs
                for (const side of [-1, 1]) {
                    const legGeom = new THREE.BoxGeometry(1, 2.5, 1);
                    const legMat = new THREE.MeshStandardMaterial({ color: 0x333344, roughness: 0.8, metalness: 0 });
                    const leg = new THREE.Mesh(legGeom, legMat);
                    leg.position.set(side * 0.5, -1.25, 0);
                    leg.castShadow = true;
                    avatar.add(leg);
                }

                avatar.position.fromArray(player.position);
                scene.add(avatar);

                // Animate idle
                const animateAvatar = () => {
                    const time = Date.now() * 0.002;
                    avatar.children.forEach((child, i) => {
                        if (child.position.y > 0 && child.position.y < 3) {
                            child.rotation.z = Math.sin(time + i) * 0.05;
                        }
                    });
                    requestAnimationFrame(animateAvatar);
                };
                animateAvatar();
            }

            // Ground plane (extends far)
            const groundGeom = new THREE.PlaneGeometry(500, 500);
            const groundMat = materials.grass.clone();
            const ground = new THREE.Mesh(groundGeom, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.position.y = -0.1;
            ground.receiveShadow = true;
            scene.add(ground);
        }

        function getMoneyPerSec(id, mutation) {
            // Simplified calculation matching server
            const baseValues = {
                'skibidi_toilet': 5, 'ohio_rizzler': 6, 'sigma_grindset': 7, 'gyatt_master': 8, 'fanum_tax': 9,
                'skull_emoji': 15, 'rizz_god': 18, 'mewing_master': 20, 'looksmaxxer': 22, 'mogger': 25,
                'brainrot_cat': 40, 'dingus_dog': 45, 'sigma_face': 50, 'skull_king': 55, 'rizz_phoenix': 60,
                'brainrot_dragon': 100, 'ultimate_sigma': 120, 'gyatt_goddess': 140, 'ohio_overlord': 160, 'fanum_emperor': 180,
                'brainrot_titan': 300, 'sigma_prime': 350, 'void_walker': 400, 'rizz_omni': 450,
                'brainrot_archon': 750, 'sigma_eternal': 900, 'gyatt_singularity': 1100,
                'the_one_brainrot': 2500,
            };
            const rarityMult = { Common: 1, Uncommon: 1.5, Rare: 2.5, Epic: 4, Legendary: 7, Mythic: 12, BrainrotGod: 25 };
            const mutationMult = { None: 1, Shiny: 1.5, Golden: 2.5, Rainbow: 4, Corrupted: 3, Glitched: 5, Void: 10 };

            // Find rarity
            let rarity = 'Common';
            for (const br of layout.sampleBrainrots.concat(layout.conveyorBrainrots)) {
                if (br.id === id) { rarity = br.rarity; break; }
            }

            return (baseValues[id] || 10) * rarityMult[rarity] * mutationMult[mutation];
        }

        function formatNumber(num) {
            if (num >= 1000000000) return (num / 1000000000).toFixed(1) + 'B';
            if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
            if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
            return num.toString();
        }

        // Set camera based on shot parameter
        function setCameraShot() {
            const shotParam = new URLSearchParams(window.location.search).get('shot');
            const shot = shotParam ? parseInt(shotParam) : 0;

            const cameras = layout.cameras;
            let cam;
            switch (shot) {
                case 0: cam = cameras.start; break;
                case 1: cam = cameras.play; break;
                case 2: cam = cameras.progression; break;
                case 3: cam = cameras.summit; break;
                default: cam = cameras.start;
            }

            camera.position.fromArray(cam.position);
            camera.lookAt(new THREE.Vector3().fromArray(cam.target));
            camera.fov = cam.fov;
            camera.updateProjectionMatrix();

            controls.target.fromArray(cam.target);
            controls.update();

            // Update UI label
            const labels = ['Start View', 'Mid-Play View', 'Progression/Rarity View', 'Summit/Thumbnail'];
            document.getElementById('shot-label').textContent = `📸 Shot ${shot}: ${labels[shot]}`;
        }

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);

            // Animate conveyor sections
            const time = Date.now() * 0.001;
            for (const section of layout.spawnLane.conveyorSections) {
                // We'd need to store references to animate - skipping for static render
            }

            controls.update();
            renderer.render(scene, camera);
        }

        // Initialize
        async function init() {
            await loadLayout();
            buildWorld();
            setCameraShot();

            // Signal ready for screenshot
            document.body.dataset.ready = 'true';

            animate();
        }

        init().catch(console.error);
    </script>
